name: CI

# Runs on every push and pull request targeting main — catches a broken
# build before it ever reaches Vercel (or a teammate's branch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: only needed if you later add steps that actually run
          # the app (e.g. a preview server or e2e tests). `vite build` just
          # bundles the code, so it succeeds even without these — but
          # setting them here means the workflow is ready for that later.
          # Add the real values under Settings → Secrets and variables →
          # Actions in your GitHub repo.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
